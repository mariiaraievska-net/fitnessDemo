<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дмитрий Зайцев — заявка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: одна мобильная колонка до 480px; фирменные цвета блога — тёмно-синий, коралловый, жёлтый;
   заголовки — узкий капс (как в каруселях), карточки на кремовом фоне. Клиент проходит воронку
   «главная → анкета → расчёт и запись → готово», тренер видит входящие заявки. */
:root {
  --bg: #FBF6EE;
  --card: #FFFFFF;
  --ink: #161D45;
  --muted: #6E7191;
  --line: rgba(22, 29, 69, .1);
  --navy: #26338F;
  --navy-deep: #1A2470;
  --navy-soft: #E7EAFB;
  --coral: #EE5A52;
  --coral-soft: #FDE6E3;
  --sun: #FFC53D;
  --sun-soft: #FFF2CC;
  --mint: #1F9D73;
  --mint-soft: #DDF4EA;
  --on-navy: #FFFFFF;
  --field: #F5F1EA;
  --shadow: 0 12px 30px -18px rgba(22, 29, 69, .35), 0 1px 3px rgba(22, 29, 69, .06);
  --f-display: "Oswald", "Arial Narrow", Impact, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1124; --card: #171D3B; --ink: #F3F0E8; --muted: #9EA3C4; --line: rgba(255, 255, 255, .1);
    --navy: #8E9CFF; --navy-deep: #1E2766; --navy-soft: rgba(142, 156, 255, .14);
    --coral: #FF7C72; --coral-soft: rgba(255, 124, 114, .15);
    --sun: #FFCF5C; --sun-soft: rgba(255, 207, 92, .14);
    --mint: #5FD3A8; --mint-soft: rgba(95, 211, 168, .14);
    --field: #20274A; --shadow: 0 12px 30px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1124; --card: #171D3B; --ink: #F3F0E8; --muted: #9EA3C4; --line: rgba(255, 255, 255, .1);
  --navy: #8E9CFF; --navy-deep: #1E2766; --navy-soft: rgba(142, 156, 255, .14);
  --coral: #FF7C72; --coral-soft: rgba(255, 124, 114, .15);
  --sun: #FFCF5C; --sun-soft: rgba(255, 207, 92, .14);
  --mint: #5FD3A8; --mint-soft: rgba(95, 211, 168, .14);
  --field: #20274A; --shadow: 0 12px 30px -18px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
img { display: block; max-width: 100%; }

.app {
  max-width: 480px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(110px + env(safe-area-inset-bottom, 0px));
}
.view { display: flex; flex-direction: column; gap: 22px; animation: viewIn .32s cubic-bezier(.2, .8, .2, 1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

h1, h2, h3 { margin: 0; text-wrap: balance; }
.caps { font-family: var(--f-display); text-transform: uppercase; font-weight: 600; letter-spacing: .01em; line-height: 1.05; }
.h-page { font-size: 34px; }
.h-sec { font-family: var(--f-display); text-transform: uppercase; font-size: 21px; font-weight: 600; letter-spacing: .01em; }
.hl { color: var(--coral); }
.eyebrow { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); border: 1px solid var(--line); }
.ic { width: 20px; height: 20px; flex: none; }

/* ---------- Demo mode switch ---------- */
.demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.demo-bar .eyebrow { font-size: 10px; }
.mode { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.mode button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 800; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.mode .dot { min-width: 18px; height: 18px; border-radius: 9px; background: var(--coral); color: #fff; font-size: 11px; display: inline-grid; place-items: center; padding: 0 5px; }

/* ---------- Header ---------- */
.top { display: flex; align-items: center; gap: 12px; }
.ava { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex: none; background: var(--sun); box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--sun); }
.ava img { width: 100%; height: 100%; object-fit: cover; }
.top b { display: block; font-size: 16px; font-weight: 800; }
.top .st { font-size: 12.5px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.top .st i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px var(--mint-soft); }

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; border-radius: 26px; background: var(--navy-deep); color: var(--on-navy); padding: 22px 20px 20px; min-height: 340px; display: flex; flex-direction: column; }
.hero-photo { position: absolute; right: -40px; top: 0; width: 72%; height: 100%; object-fit: cover; object-position: 30% 0; -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 38%); mask-image: linear-gradient(to right, transparent 0%, #000 38%); opacity: .95; }
.hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 55%; background: linear-gradient(to top, var(--navy-deep) 30%, transparent); pointer-events: none; }
.hero > *:not(img) { position: relative; z-index: 1; }
.hero .tag { align-self: flex-start; background: var(--sun); color: #161D45; font-weight: 800; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; }
.hero h1 { font-size: 40px; margin-top: 14px; max-width: 64%; }
.hero h1 span { color: var(--sun); }
.hero p { margin: auto 0 14px; padding-top: 70px; font-size: 14.5px; max-width: 92%; color: rgba(255, 255, 255, .86); }

.btn { border: 0; border-radius: 16px; padding: 16px 18px; font-weight: 800; font-size: 15.5px; display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; transition: transform .15s, opacity .2s; text-align: left; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-coral { background: var(--coral); color: #fff; box-shadow: 0 12px 24px -12px rgba(238, 90, 82, .9); }
.btn-sun { background: var(--sun); color: #161D45; }
.btn-ghost { background: var(--card); border: 1px solid var(--line); color: var(--ink); justify-content: center; }
.btn small { display: block; font-weight: 600; font-size: 12px; opacity: .85; }
.btn .arr { width: 34px; height: 34px; border-radius: 11px; background: rgba(255, 255, 255, .22); display: grid; place-items: center; flex: none; }

.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fact { padding: 12px 10px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); }
.fact b { font-family: var(--f-display); font-size: 20px; font-weight: 600; display: block; line-height: 1.1; }
.fact span { font-size: 11.5px; color: var(--muted); font-weight: 600; line-height: 1.3; display: block; margin-top: 3px; }

.pains { display: flex; flex-wrap: wrap; gap: 8px; }
.pain { padding: 8px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
.pain:nth-child(3n+1) { background: var(--coral-soft); border-color: transparent; }
.pain:nth-child(3n+2) { background: var(--sun-soft); border-color: transparent; }
.pain:nth-child(3n) { background: var(--navy-soft); border-color: transparent; }

.prog { display: grid; grid-template-columns: 44px 1fr; gap: 4px 12px; padding: 16px; align-items: start; }
.prog .p-ic { grid-row: span 3; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; }
.prog .p-ic svg { width: 22px; height: 22px; }
.prog b { font-size: 15.5px; font-weight: 800; }
.prog p { margin: 0; font-size: 13px; color: var(--muted); }
.prog .price { font-family: var(--f-display); font-size: 17px; font-weight: 600; margin-top: 4px; }
.prog .price small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 600; text-transform: none; }
.t-coral { background: var(--coral-soft); color: var(--coral); }
.t-sun { background: var(--sun-soft); color: #B07A00; }
.t-navy { background: var(--navy-soft); color: var(--navy); }
.t-mint { background: var(--mint-soft); color: var(--mint); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .t-sun { color: var(--sun); } }
:root[data-theme="dark"] .t-sun { color: var(--sun); }

.steps { counter-reset: s; display: flex; flex-direction: column; gap: 0; padding: 6px 16px; }
.step { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.step:last-child { border-bottom: 0; }
.step::before { counter-increment: s; content: counter(s); width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--bg); font-family: var(--f-display); font-weight: 600; display: grid; place-items: center; font-size: 15px; }
.step b { display: block; font-size: 14.5px; }
.step span { font-size: 13px; color: var(--muted); }

.cert { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.cert button { border: 0; padding: 0; background: none; border-radius: 12px; overflow: hidden; }
.cert img { width: 100%; aspect-ratio: 760 / 576; object-fit: cover; }
.cert-rows { display: flex; flex-wrap: wrap; gap: 6px; }
.cert-rows span { font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 8px; background: var(--field); }

.faq { padding: 4px 16px; }
.faq details { border-bottom: 1px solid var(--line); }
.faq details:last-child { border-bottom: 0; }
.faq summary { list-style: none; padding: 14px 0; font-weight: 800; font-size: 14.5px; display: flex; justify-content: space-between; gap: 12px; cursor: pointer; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-family: var(--f-display); font-size: 22px; line-height: 1; color: var(--coral); transition: transform .2s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq p { margin: 0 0 14px; font-size: 13.5px; color: var(--muted); }

/* ---------- Sticky bottom bar ---------- */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 65%, transparent); }
.bar-in { max-width: 448px; margin: 0 auto; display: flex; gap: 10px; }

/* ---------- Quiz ---------- */
.q-top { display: flex; align-items: center; gap: 12px; }
.back { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; flex: none; }
.progress { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--coral); border-radius: 3px; transition: width .35s; }
.q-count { font-size: 12.5px; font-weight: 800; color: var(--muted); min-width: 34px; text-align: right; }
.q-head p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.q-head h1 { font-size: 30px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r-md); background: var(--card); border: 1.5px solid var(--line); text-align: left; transition: border-color .15s, background .15s, transform .12s; }
.opt:active { transform: scale(.985); }
.opt .o-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; font-size: 20px; }
.opt b { display: block; font-size: 15px; font-weight: 800; }
.opt span.d { font-size: 12.5px; color: var(--muted); }
.opt .tick { margin-left: auto; width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; color: transparent; }
.opt.radio .tick { border-radius: 50%; }
.opt[aria-pressed="true"] { border-color: var(--coral); background: var(--coral-soft); }
.opt[aria-pressed="true"] .tick { background: var(--coral); border-color: var(--coral); color: #fff; }
.opt .tick svg { width: 14px; height: 14px; }
.sub-q { font-weight: 800; font-size: 14px; margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--coral); background: var(--coral-soft); }

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12.5px; font-weight: 800; color: var(--muted); }
.inp { position: relative; }
.inp input, .inp textarea { width: 100%; border: 1.5px solid transparent; background: var(--card); border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 700; box-shadow: var(--shadow); outline: none; }
.inp textarea { font-size: 15px; font-weight: 600; resize: none; min-height: 80px; }
.inp input:focus, .inp textarea:focus { border-color: var(--coral); }
.inp input[aria-invalid="true"] { border-color: var(--coral); background: var(--coral-soft); }
.inp .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 700; color: var(--muted); pointer-events: none; }
.hint { font-size: 12.5px; color: var(--muted); }
.err { font-size: 12.5px; color: var(--coral); font-weight: 700; min-height: 18px; }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--muted); }
.consent input { width: 20px; height: 20px; accent-color: var(--coral); margin: 0; flex: none; }
.live { padding: 12px 14px; border-radius: 14px; background: var(--sun-soft); font-size: 13px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.live b { font-family: var(--f-display); font-size: 18px; font-weight: 600; }

/* ---------- Result ---------- */
.plan { background: var(--navy-deep); color: var(--on-navy); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; }
.plan::before { content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%; right: -80px; top: -100px; background: var(--coral); opacity: .9; }
.plan::after { content: ""; position: absolute; width: 56px; height: 56px; border-radius: 50%; right: 56px; top: 34px; background: var(--sun); }
.plan > * { position: relative; z-index: 1; }
.plan .eyebrow { color: rgba(255, 255, 255, .7); }
.plan .kcal { font-family: var(--f-display); font-size: 58px; font-weight: 600; line-height: 1; }
.plan .kcal small { font-size: 18px; color: rgba(255, 255, 255, .75); margin-left: 6px; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.macros div { background: rgba(255, 255, 255, .1); border-radius: 14px; padding: 10px; }
.macros b { font-family: var(--f-display); font-size: 20px; font-weight: 600; display: block; }
.macros span { font-size: 11.5px; color: rgba(255, 255, 255, .75); font-weight: 600; }
.plan .note { font-size: 13px; color: rgba(255, 255, 255, .85); background: rgba(255, 255, 255, .08); padding: 10px 12px; border-radius: 12px; }

.tips { padding: 6px 16px; }
.tip { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.tip:last-child { border-bottom: 0; }
.tip i { font-style: normal; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; }
.tip b { display: block; font-size: 14px; }

.rec { padding: 16px; display: flex; flex-direction: column; gap: 10px; border: 2px solid var(--coral); }
.rec ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; }
.rec li { display: flex; gap: 8px; }
.rec li svg { width: 18px; height: 18px; color: var(--mint); flex: none; margin-top: 1px; }
.rec .rec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.rec .rec-head b { font-size: 16px; }
.rec .rec-head .price { font-family: var(--f-display); font-size: 18px; font-weight: 600; white-space: nowrap; }

.days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px 4px; }
.days::-webkit-scrollbar { display: none; }
.day { flex: none; width: 62px; padding: 10px 0; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); text-align: center; }
.day span { display: block; font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.day b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 600; margin-top: 2px; }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day[aria-pressed="true"] span { color: inherit; opacity: .75; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { padding: 12px 6px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); font-weight: 800; font-size: 15px; text-align: center; }
.slot small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); }
.slot:disabled { background: transparent; border-style: dashed; color: var(--muted); text-decoration: line-through; opacity: .6; cursor: not-allowed; }
.slot[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); color: #fff; }
.slot[aria-pressed="true"] small { color: rgba(255, 255, 255, .85); }
.skip { background: none; border: 0; color: var(--muted); font-weight: 700; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 4px; align-self: center; }

/* ---------- Done ---------- */
.done-hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 18px; }
.done-badge { width: 84px; height: 84px; border-radius: 28px; background: var(--mint); color: #fff; display: grid; place-items: center; transform: rotate(-6deg); box-shadow: 0 16px 30px -14px var(--mint); }
.done-badge svg { width: 42px; height: 42px; }
.done-hero h1 { font-size: 34px; }
.done-hero p { margin: 0; color: var(--muted); max-width: 330px; }
.summary { padding: 6px 16px; }
.summary div { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.summary div:last-child { border-bottom: 0; }
.summary span { color: var(--muted); font-weight: 600; }
.summary b { text-align: right; }

/* ---------- Trainer ---------- */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { padding: 12px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); }
.kpi b { font-family: var(--f-display); font-size: 28px; font-weight: 600; display: block; line-height: 1.05; }
.kpi span { font-size: 11.5px; font-weight: 700; color: var(--muted); line-height: 1.25; display: block; margin-top: 2px; }
.kpi.accent { background: var(--navy-deep); color: #fff; border-color: transparent; }
.kpi.accent span { color: rgba(255, 255, 255, .75); }
.auto { display: flex; gap: 12px; padding: 14px; align-items: center; background: var(--sun-soft); border-radius: var(--r-md); }
.auto .a-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--sun); color: #161D45; display: grid; place-items: center; flex: none; }
.auto p { margin: 0; font-size: 13px; }
.auto b { font-size: 14px; display: block; }
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 0 16px 2px; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 13px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters button em { font-style: normal; opacity: .6; margin-left: 4px; }
.leads { display: flex; flex-direction: column; gap: 10px; }

  /* ================= Клиент: результат + запись ================= */
  function consultDays() {
    const out = [];
    let d = addDays(TODAY, 0);
    while (out.length < 6) { if (d.getDay() !== 0) out.push(iso(d)); d = addDays(d, 1); }
    return out;
  }
  function slotFree(date, time) {
    const [hh, mm] = time.split(":").map(Number);
    // время слота задано по Батуми — переводим в реальный момент
    const t = Date.UTC(...date.split("-").map((v, i) => i === 1 ? v - 1 : +v), hh, mm) - CONFIG.coachTz * 60000;
    if (t < Date.now() + 90 * 60000) return false;
    if (store.leads.some(l => l.slot && l.slot.date === date && l.slot.time === time && l.status !== "lost")) return false;
    return hash(date + time) % 4 !== 0;
  }
  function localTime(date, time) {
    const mine = -new Date().getTimezoneOffset();
    if (mine === CONFIG.coachTz) return "";
    const [hh, mm] = time.split(":").map(Number);
    let m = hh * 60 + mm + (mine - CONFIG.coachTz);
    m = ((m % 1440) + 1440) % 1440;
    return pad(Math.floor(m / 60)) + ":" + pad(m % 60);
  }

    if (a.struggles.includes("plateau")) tips.push(["📉", "t-coral", "Вес стоит", "Проверьте реальную калорийность за 3 дня и шаги. Часто «мало ем» — это 1000 ккал в перекусах."]);
    if (a.struggles.includes("energy")) tips.push(["⚡", "t-mint", "Нет энергии", "Вода " + p.water + " л, 7+ часов сна и 20 минут прогулки днём дают больше, чем кофе."]);
    if (a.struggles.includes("time")) tips.push(["⏱️", "t-sun", "Нет времени", "Хватит 3 тренировок по 30–40 минут в неделю. Дома, без дороги в зал."]);
    if (a.struggles.includes("yoyo")) tips.push(["🔁", "t-coral", "Вес возвращается", "Без жёстких запретов: в рационе остаётся любимая еда, поэтому результат держится."]);
    if (a.struggles.includes("food")) tips.push(["🥗", "t-mint", "Не знаю, что есть", "Начните с тарелки: половина — овощи, четверть — белок, четверть — крупы."]);
    if (a.struggles.includes("fear")) tips.push(["🛡️", "t-navy", "Безопасно после родов", "Сначала дыхание, кор и тазовое дно, потом нагрузка. Обязательно с разрешения врача."]);

    $("#root").innerHTML =
      '<section class="view">' +
        '<div class="q-top"><button class="back" type="button" id="q-back" aria-label="Назад">' + svg("i-back") + '</button><span class="eyebrow">Анкета заполнена</span></div>' +
        '<h1 class="caps h-page">' + (first ? first + ", вот " : "Вот ") + '<span class="hl">ваш расчёт</span></h1>' +

        '<div class="plan">' +
          '<div><div class="eyebrow">Калорий в день</div><div class="kcal num">' + p.kcal + '<small>ккал</small></div></div>' +
          '<div class="macros">' +
            '<div><b class="num">' + p.protein + ' г</b><span>белок</span></div>' +
            '<div><b class="num">' + p.fat + ' г</b><span>жиры</span></div>' +
            '<div><b class="num">' + p.carbs + ' г</b><span>углеводы</span></div>' +
          '</div>' +
          '<div class="note">🎯 ' + goalLine + ' · вода ' + p.water + ' л в день</div>' +
        '</div>' +

        (tips.length ? '<div class="sec"><h2 class="h-sec">Что важно именно вам</h2><div class="card tips">' +
          tips.slice(0, 3).map(t => '<div class="tip"><i class="' + t[1] + '">' + t[0] + '</i><div><b>' + t[2] + '</b>' + t[3] + '</div></div>').join("") + '</div></div>' : "") +

        '<div class="sec"><h2 class="h-sec">Вам подходит</h2>' +
          '<div class="card rec">' +
            '<div class="rec-head"><b>' + esc(prog.title) + '</b><span class="price">' + esc(prog.price) + '</span></div>' +
            '<ul>' + prog.items.map(i => '<li>' + svg("i-check") + esc(i) + '</li>').join("") + '</ul>' +
          '</div>' +
        '</div>' +

        '<div class="sec">' +
          '<h2 class="h-sec">Бесплатная консультация</h2>' +
          '<p class="muted" style="margin:-4px 0 0;font-size:13.5px">' + CONFIG.consultMinutes + ' минут в ' + esc(a.messenger === "Instagram" ? "Telegram или Instagram" : a.messenger) + '. Время по Батуми' + (tzNote ? ', ниже — ваше местное' : '') + '.</p>' +
          '<div class="days" role="group" aria-label="День">' + days.map(d => {
            const dt = parse(d);
            return '<button type="button" class="day" data-day="' + d + '" aria-pressed="' + (d === ui.day) + '"><span>' + (d === iso(TODAY) ? "Сегодня" : DAY_SHORT[dt.getDay()]) + '</span><b class="num">' + dt.getDate() + '</b></button>';
          }).join("") + '</div>' +
          '<div class="slots" role="group" aria-label="Время">' + CONFIG.consultTimes.map(t => {
            const free = slotFree(ui.day, t), sel = a.slot && a.slot.date === ui.day && a.slot.time === t, loc = localTime(ui.day, t);
            return '<button type="button" class="slot num" data-time="' + t + '"' + (free ? "" : " disabled") + ' aria-pressed="' + !!sel + '">' + t + (loc ? '<small>у вас ' + loc + '</small>' : "") + '</button>';
          }).join("") + '</div>' +
          '<button class="skip" type="button" id="no-slot">Без консультации — пусть Дмитрий напишет сам</button>' +
        '</div>' +
      '</section>';

    $("#q-back").onclick = goBack;
    document.querySelectorAll(".day").forEach(b => b.onclick = () => { haptic("select"); ui.day = b.dataset.day; renderResult(); });
    document.querySelectorAll(".slot").forEach(b => b.onclick = () => { haptic("select"); a.slot = { date: ui.day, time: b.dataset.time }; renderResult(); });
    $("#no-slot").onclick = () => { a.slot = null; submit(); };

    const label = a.slot ? "Записаться · " + fmtDay(a.slot.date) + ", " + a.slot.time : "Выберите время консультации";
    setBar('<button class="btn btn-coral" type="button" id="submit"' + (a.slot ? "" : " disabled") + '><span>' + esc(label) + '</span><span class="arr">' + svg("i-arrow") + '</span></button>');
    $("#submit").onclick = submit;
  }

  function submit() {
    const a = ui.a;
    const lead = {
      id: "l" + Date.now(), source: tg ? "Telegram" : "Instagram", createdAt: Date.now(), status: "new",
      name: a.name.trim(), contact: a.contact.trim(), messenger: a.messenger, city: a.city.trim(), comment: a.comment.trim(),
      goal: a.goal, sex: a.goal === "postpart" ? "f" : a.sex, ppWhen: a.ppWhen, bf: a.bf,
      age: a.age, h: a.h, w: a.w, gw: a.gw, activity: a.activity, format: a.format,
      struggles: a.struggles.slice(), start: a.start, slot: a.slot, tgId: tgUser ? tgUser.id : null
    };
    store.leads.unshift(lead);
    save();
    ui.lastLead = lead.id;
    sendLead(lead);
    haptic("success");
    go("done");
  }

  /* В боевой версии заявка уходит на сервер: бот присылает её Дмитрию в Telegram и пишет строку в таблицу */
  function sendLead(lead) {
    if (!CONFIG.webhookUrl) return;
    const payload = Object.assign({}, lead, { plan: calcPlan(lead), initData: tg ? tg.initData : "" });
    fetch(CONFIG.webhookUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).catch(() => { });
  }

  /* ================= Клиент: готово ================= */
  function renderDone() {
    const lead = store.leads.find(l => l.id === ui.lastLead);
    if (!lead) { go("home"); return; }
    const p = calcPlan(lead);
    $("#root").innerHTML =
      '<section class="view">' +
        '<div class="done-hero">' +
          '<div class="done-badge">' + svg("i-check", "") + '</div>' +
          '<h1 class="caps">Заявка <span class="hl">у Дмитрия</span></h1>' +
          '<p>' + (lead.slot
            ? "Консультация " + fmtDay(lead.slot.date) + " в " + lead.slot.time + " (Батуми). Напомним за час — в " + esc(lead.messenger) + "."
            : "Дмитрий получил анкету и напишет вам в " + esc(lead.messenger) + " в течение дня.") + '</p>' +
        '</div>' +
        '<div class="card summary">' +
          '<div><span>Цель</span><b>' + esc(GOALS[lead.goal].t) + '</b></div>' +
          '<div><span>Формат</span><b>' + esc(FORMATS[lead.format].t) + '</b></div>' +
          '<div><span>Норма</span><b class="num">' + p.kcal + ' ккал · белок ' + p.protein + ' г</b></div>' +
          '<div><span>Связь</span><b>' + esc(lead.messenger) + ' · ' + esc(lead.contact) + '</b></div>' +
        '</div>' +
        '<div class="sec"><h2 class="h-sec">До консультации</h2><div class="card steps">' +
          '<div class="step"><div><b>Сделайте фото в полный рост</b><span>Спереди, сбоку, сзади — чтобы потом увидеть разницу. По желанию.</span></div></div>' +
          '<div class="step"><div><b>Запишите, что едите 2–3 дня</b><span>Без изменений — так Дмитрий быстрее найдёт, что мешает.</span></div></div>' +
          '<div class="step"><div><b>Подготовьте вопросы</b><span>15 минут — только про вас.</span></div></div>' +
        '</div></div>' +
      '</section>';

    setBar('<button class="btn btn-ghost" type="button" id="close">' + (tg ? "Закрыть" : "На главную") + '</button>' +
           '<button class="btn btn-sun" type="button" id="see-coach" style="justify-content:center">Как видит тренер</button>');
    $("#close").onclick = () => { if (tg) tg.close(); else { ui.a = blankAnswers(); go("home"); } };
    $("#see-coach").onclick = () => { ui.mode = "coach"; ui.filter = "all"; render(); window.scrollTo({ top: 0 }); };
  }

  /* ================= Тренер: заявки ================= */
  const AVA_TONES = ["t-coral", "t-sun", "t-navy", "t-mint"];
  function leadTags(l) {
    const t = [GOALS[l.goal].short, FORMATS[l.format].short];
    if (l.goal === "postpart") t.push(PP_WHEN[l.ppWhen] + (l.bf === "yes" ? " · ГВ" : ""));
    if (l.w && l.gw && l.w > l.gw) t.push("−" + Math.round((l.w - l.gw) * 10) / 10 + " кг");
    if (l.city) t.push(l.city);
    return t;
  }
  function renderCoach() {
    const L = store.leads;
    const weekAgo = Date.now() - 7 * 86400000;
    const week = L.filter(l => l.createdAt > weekAgo);
    const consults = L.filter(l => l.slot && l.status !== "lost" && parse(l.slot.date) >= TODAY).length;
    const decided = L.filter(l => l.status === "client" || l.status === "lost").length;
    const conv = L.length ? Math.round(L.filter(l => l.status === "client").length / L.length * 100) : 0;
    const counts = {
      all: L.length,
      hot: L.filter(l => temperature(l) === "hot" && l.status === "new").length,
      new: L.filter(l => l.status === "new").length,
      consult: L.filter(l => l.status === "consult").length,
      client: L.filter(l => l.status === "client").length
    };
    const shown = L.filter(l => ui.filter === "all" ? true
      : ui.filter === "hot" ? temperature(l) === "hot" && l.status === "new"
      : l.status === ui.filter);

    $("#root").innerHTML =
      '<section class="view">' +
        '<header class="top">' +
          '<div class="ava"><img src="img/avatar.jpg" alt=""></div>' +
          '<div><b>Заявки</b><div class="st">Приходят сами из Instagram и Telegram</div></div>' +
        '</header>' +
        '<div class="kpis">' +
          '<div class="kpi accent"><b class="num">' + week.length + '</b><span>заявок за 7 дней</span></div>' +
          '<div class="kpi"><b class="num">' + consults + '</b><span>консультаций в календаре</span></div>' +
          '<div class="kpi"><b class="num">' + conv + '%</b><span>стали клиентами</span></div>' +
        '</div>' +
        '<div class="auto"><div class="a-ic">' + svg("i-bolt") + '</div><div><b>Без переписки в директе</b><p>Каждый пришёл с анкетой, параметрами и расчётом. ' + decided + ' из ' + L.length + ' уже с решением.</p></div></div>' +
        '<div class="filters" role="group" aria-label="Фильтр">' +
          [["all", "Все"], ["hot", "🔥 Горячие"], ["new", "Новые"], ["consult", "Консультация"], ["client", "Клиенты"]]
            .map(([k, t]) => '<button type="button" data-f="' + k + '" aria-pressed="' + (ui.filter === k) + '">' + t + '<em class="num">' + counts[k] + '</em></button>').join("") +
        '</div>' +
        '<div class="leads">' + (shown.length ? shown.map(leadCard).join("") : '<div class="empty">Здесь пока пусто</div>') + '</div>' +
      '</section>';

    setBar("");
    document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { haptic("select"); ui.filter = b.dataset.f; renderCoach(); });
    document.querySelectorAll("[data-lead]").forEach(b => b.onclick = () => openLead(b.dataset.lead));
  }
  function leadCard(l) {
    const temp = temperature(l), fresh = l.status === "new" && !store.seen.includes(l.id);
    return '<button type="button" class="lead' + (fresh ? " fresh" : "") + '" data-lead="' + l.id + '">' +
      '<div class="lead-top">' +
        '<div class="l-ava ' + AVA_TONES[hash(l.name) % 4] + '">' + esc(l.name.trim().charAt(0).toUpperCase()) + '</div>' +
        '<div><b>' + esc(l.name) + (l.age ? ', ' + l.age : "") + '</b><span class="when">' + ago(l.createdAt) + ' · ' + esc(l.source) + '</span></div>' +
        (l.status === "new" || l.status === "consult" ? '<span class="temp ' + temp + '">' + TEMP[temp] + '</span>' : "") +
      '</div>' +
      '<div class="lead-tags">' + leadTags(l).map(t => '<span>' + esc(t) + '</span>').join("") + '</div>' +
      '<div class="lead-foot">' +
        (l.slot ? '<span class="slotline">' + svg("i-cal") + fmtDay(l.slot.date) + ', ' + l.slot.time + '</span>' : '<span class="muted">Ждёт сообщения</span>') +
        '<span class="status st-' + l.status + '">' + STATUS[l.status] + '</span>' +
      '</div>' +
    '</button>';
  }
  function openLead(id) {
    const l = store.leads.find(x => x.id === id); if (!l) return;
    if (!store.seen.includes(id)) { store.seen.push(id); save(); }
    const p = calcPlan(l);
    const contactUrl = l.messenger === "WhatsApp" ? "https://wa.me/" + l.contact.replace(/\D/g, "")
      : l.messenger === "Instagram" ? "https://ig.me/m/" + l.contact.replace(/^@/, "")
      : /^@?[A-Za-z][\w]{3,}$/.test(l.contact) ? "https://t.me/" + l.contact.replace(/^@/, "") : "";
    const draft = "Здравствуйте, " + l.name.split(" ")[0] + "! Это Дмитрий. Посмотрел вашу анкету: цель — " + GOALS[l.goal].t.toLowerCase() + ". " +
      (l.slot ? "Жду вас на консультации " + fmtDay(l.slot.date) + " в " + l.slot.time + "." : "Когда удобно созвониться на 15 минут?");

    openSheet(
      '<div class="lead-top" style="gap:12px"><div class="l-ava ' + AVA_TONES[hash(l.name) % 4] + '" style="width:48px;height:48px;font-size:20px">' + esc(l.name.charAt(0).toUpperCase()) + '</div>' +
        '<div><h3>' + esc(l.name) + '</h3><span class="muted" style="font-size:13px;font-weight:600">' + ago(l.createdAt) + ' · ' + esc(l.messenger) + ' ' + esc(l.contact) + '</span></div></div>' +
      '<div class="stat-row" role="group" aria-label="Статус">' + Object.entries(STATUS).map(([k, t]) => '<button type="button" data-st="' + k + '" aria-pressed="' + (l.status === k) + '">' + t + '</button>').join("") + '</div>' +
      '<div class="plan mini" style="padding:16px;gap:12px"><div class="eyebrow">Расчёт, который получил клиент</div>' +
        '<div class="macros"><div><b class="num">' + p.kcal + '</b><span>ккал</span></div><div><b class="num">' + p.protein + ' г</b><span>белок</span></div><div><b class="num">' + (p.weeks ? p.weeks + " нед" : "—") + '</b><span>до цели</span></div></div></div>' +
      '<div class="card kv">' +
        '<div><span>Цель</span><b>' + esc(GOALS[l.goal].t) + '</b></div>' +
        (l.goal === "postpart" ? '<div><span>После родов</span><b>' + esc(PP_WHEN[l.ppWhen]) + (l.bf === "yes" ? ", кормит грудью" : "") + '</b></div>' : "") +
        '<div><span>Параметры</span><b class="num">' + l.age + ' ' + plural(l.age, 'год', 'года', 'лет') + ' · ' + l.h + ' см · ' + l.w + ' → ' + l.gw + ' кг</b></div>' +
        '<div><span>ИМТ</span><b class="num">' + p.bmi + '</b></div>' +
        '<div><span>Активность</span><b>' + esc(ACTIVITY[l.activity].t) + '</b></div>' +
        '<div><span>Формат</span><b>' + esc(FORMATS[l.format].t) + '</b></div>' +
        '<div><span>Мешает</span><b>' + l.struggles.map(s => esc(STRUGGLES[s])).join(", ") + '</b></div>' +
        '<div><span>Старт</span><b>' + esc(START[l.start].t) + '</b></div>' +
        (l.city ? '<div><span>Город</span><b>' + esc(l.city) + '</b></div>' : "") +
        (l.slot ? '<div><span>Консультация</span><b>' + fmtDay(l.slot.date) + ', ' + l.slot.time + '</b></div>' : "") +
        (l.comment ? '<div><span>Комментарий</span><b>' + esc(l.comment) + '</b></div>' : "") +
      '</div>' +
      '<div class="row2">' +
        '<button class="btn btn-ghost" type="button" id="copy-draft">' + svg("i-copy") + 'Шаблон</button>' +
        '<button class="btn btn-coral" type="button" id="write" style="justify-content:center"' + (contactUrl ? "" : " disabled") + '>' + svg("i-msg") + 'Написать</button>' +
      '</div>'
    );

    document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => {
      haptic("select");
      l.status = b.dataset.st; save();
      document.querySelectorAll("[data-st]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      render();
    });
    $("#copy-draft").onclick = () => {
      const done = () => toast("Сообщение скопировано — вставьте в чат");
      if (navigator.clipboard) navigator.clipboard.writeText(draft).then(done, () => toast(draft)); else toast(draft);
    };
    $("#write").onclick = () => {
      if (!contactUrl) return;
      if (tg && contactUrl.startsWith("https://t.me/")) tg.openTelegramLink(contactUrl);
      else if (tg) tg.openLink(contactUrl);
      else window.open(contactUrl, "_blank", "noopener");
    };
    render();
  }

  /* ================= Шторка и тост ================= */
  function openSheet(html) {
    const root = $("#sheet-root");
    root.innerHTML = '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>' + html + '</div></div>';
    const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
    const onKey = e => { if (e.key === "Escape") close(); };
    $("#scrim").onclick = e => { if (e.target.id === "scrim") close(); };
    document.addEventListener("keydown", onKey);
  }
  let toastTimer;
  function toast(msg) {
    $("#toast-root").innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("#toast-root").innerHTML = ""; }, 2600);
  }

  /* ================= Старт ================= */
  document.querySelectorAll(".mode button").forEach(b => b.onclick = () => {
    haptic("select");
    ui.mode = b.dataset.mode;
    if (ui.mode === "client" && ui.view === "done") { ui.a = blankAnswers(); ui.view = "home"; }
    $("#sheet-root").innerHTML = "";
    render(); window.scrollTo({ top: 0 });
  });
  render();
})();
</script>
</body>
</html>
