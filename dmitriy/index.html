<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дмитрий Зайцев — тренировки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: тёмная «спортзальная» тема как в презентации-программе: угольный фон, панели с тонкой рамкой,
   оранжевые капс-заголовки по центру секций. Одна колонка до 480px, снизу таб-бар на 5 разделов. */
:root {
  --bg: #0D0E10;
  --panel: #17181C;
  --panel-2: #1F2025;
  --field: #26272D;
  --ink: #F3F3F4;
  --muted: #9A9BA3;
  --dim: #5E6068;
  --line: rgba(255, 255, 255, .08);
  --line-2: rgba(255, 255, 255, .14);
  --orange: #FF6A1A;
  --orange-2: #FF9348;
  --orange-soft: rgba(255, 106, 26, .14);
  --green: #3DD68C;
  --green-soft: rgba(61, 214, 140, .14);
  --red: #FF5A5F;
  --grad: linear-gradient(135deg, #FF8A3D 0%, #FF5A14 100%);
  --shadow: 0 18px 40px -22px rgba(0, 0, 0, .9);
  --f: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 18px;
  --r-md: 14px;
  --r-sm: 10px;
  --tab-h: 66px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f);
  font-size: 14.5px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}
/* лёгкое оранжевое свечение сверху, как подсветка зала */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(70% 35% at 85% -5%, rgba(255, 106, 26, .16), transparent 70%), radial-gradient(60% 30% at 0% 100%, rgba(255, 106, 26, .07), transparent 70%), var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
img { display: block; max-width: 100%; }

.app { max-width: 480px; margin: 0 auto; padding-inline: 16px;
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(var(--tab-h) + 40px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 18px; animation: viewIn .3s cubic-bezier(.2, .8, .2, 1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } }

h1, h2, h3 { margin: 0; text-wrap: balance; }
.title { font-weight: 900; text-transform: uppercase; letter-spacing: .01em; line-height: 1.08; }
.h-page { font-size: 26px; }
.h-page span, .accent { color: var(--orange); }
.h-sec { font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--orange); text-align: center; }
.h-sec.left { text-align: left; }
.eyebrow { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 20px; height: 20px; flex: none; }
.panel { background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.pad { padding: 16px; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.link { background: none; border: 0; padding: 0; color: var(--orange); font-weight: 700; font-size: 12.5px; }

.top { display: flex; align-items: center; gap: 12px; }
.ava { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex: none; box-shadow: 0 0 0 2px var(--orange); }
.ava img { width: 100%; height: 100%; object-fit: cover; }
.top .hi { font-size: 12px; color: var(--muted); font-weight: 600; }
.top b { display: block; font-size: 16px; font-weight: 800; }
.top .demo { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; border: 1px dashed var(--line-2); padding: 4px 8px; border-radius: 8px; background: none; }

.btn { border: 0; border-radius: var(--r-md); padding: 15px 18px; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; transition: transform .15s, opacity .2s; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-orange { background: var(--grad); color: #fff; box-shadow: 0 14px 28px -14px rgba(255, 106, 26, .9); }
.btn-dark { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line-2); }
.btn-danger { background: transparent; color: var(--red); border: 1px solid rgba(255, 90, 95, .4); }
.btn .ic { width: 18px; height: 18px; }

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; border-radius: 22px; border: 1px solid var(--line-2); min-height: 300px; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; gap: 12px; }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 10%; filter: saturate(.75) brightness(.62) contrast(1.1); }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(13, 14, 16, .92) 0%, rgba(13, 14, 16, .6) 60%, rgba(13, 14, 16, .25) 100%), linear-gradient(to top, rgba(13, 14, 16, .96) 0%, rgba(13, 14, 16, .3) 70%, rgba(13, 14, 16, .5) 100%); }
.hero > *:not(img) { position: relative; }
.hero h1 { font-size: 27px; color: var(--orange); max-width: 75%; }
.hero p { margin: 0; color: rgba(255, 255, 255, .82); font-size: 13.5px; max-width: 72%; font-weight: 500; }

/* ---------- Package ---------- */
.pkg { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
.ring { position: relative; width: 96px; height: 96px; }
.ring svg { width: 96px; height: 96px; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .c b { font-size: 26px; font-weight: 900; line-height: 1; display: block; }
.ring .c span { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.pkg-info b { font-size: 15px; font-weight: 800; display: block; }
.pkg-info .rows { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 10px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.pkg-info .rows span { display: flex; align-items: center; gap: 7px; }
.pkg-info .rows i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.pips { display: grid; grid-template-columns: repeat(var(--n, 8), 1fr); gap: 4px; }
.pips i { height: 7px; border-radius: 4px; background: var(--field); }
.pips i.done { background: var(--grad); }
.pips i.res { background: transparent; box-shadow: inset 0 0 0 1.5px var(--orange); }
.warn { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); background: var(--orange-soft); border: 1px solid rgba(255, 106, 26, .35); font-size: 13px; font-weight: 600; }
.warn .ic { color: var(--orange); }

.next { display: flex; gap: 14px; align-items: center; }
.date-tile { width: 58px; flex: none; border-radius: 12px; background: var(--grad); color: #fff; text-align: center; padding: 8px 0; }
.date-tile b { display: block; font-size: 22px; font-weight: 900; line-height: 1.05; }
.date-tile span { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.next-info { flex: 1; min-width: 0; }
.next-info b { display: block; font-size: 15px; font-weight: 800; }
.next-info span { font-size: 12.5px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.next-info .ic { width: 15px; height: 15px; }
.chev { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); display: grid; place-items: center; flex: none; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 12px 10px; border-radius: var(--r-md); background: var(--panel); border: 1px solid var(--line-2); }
.stat b { display: block; font-size: 22px; font-weight: 900; line-height: 1.1; }
.stat b small { font-size: 12px; font-weight: 700; color: var(--muted); }
.stat span { font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1.3; display: block; margin-top: 2px; }
.stat.good b { color: var(--green); }

/* ---------- Calendar ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: var(--r-md); background: var(--panel); border: 1px solid var(--line-2); }
.seg button { border: 0; background: none; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 13px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 7px; }
.seg button .ic { width: 16px; height: 16px; }
.seg button[aria-pressed="true"] { background: var(--grad); color: #fff; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head b { font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.cal-nav { display: flex; gap: 6px; }
.cal-nav button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); display: grid; place-items: center; }
.cal-nav button:disabled { opacity: .3; cursor: not-allowed; }
.cal-nav .ic { width: 16px; height: 16px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .wd { text-align: center; font-size: 10.5px; font-weight: 700; color: var(--dim); text-transform: uppercase; padding-bottom: 4px; }
.cal button { aspect-ratio: 1; border-radius: 10px; border: 1px solid transparent; background: var(--panel-2); font-weight: 700; font-size: 14px; position: relative; padding: 0; }
.cal button:disabled { background: transparent; color: var(--dim); cursor: default; }
.cal button.today { border-color: var(--line-2); }
.cal button.has::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--orange); transform: translateX(-50%); }
.cal button.done::after { background: var(--green); }
.cal button[aria-pressed="true"] { background: var(--grad); color: #fff; }
.cal button[aria-pressed="true"]::after { background: #fff; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.slot { padding: 11px 4px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); font-weight: 800; font-size: 13.5px; }
.slot:disabled { background: transparent; border-style: dashed; color: var(--dim); text-decoration: line-through; cursor: not-allowed; }
.slot.mine { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.slot[aria-pressed="true"] { background: var(--grad); border-color: transparent; color: #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.empty { text-align: center; color: var(--muted); padding: 18px 10px; font-weight: 600; font-size: 13px; }

/* ---------- Progress ---------- */
.chart { width: 100%; height: 150px; display: block; }
.chart-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; }
.chart-top b { font-size: 28px; font-weight: 900; line-height: 1; }
.delta { font-size: 12px; font-weight: 800; padding: 4px 8px; border-radius: 8px; background: var(--green-soft); color: var(--green); }
.tbl-wrap { overflow-x: auto; margin: 0 -2px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { background: var(--orange); color: #fff; font-weight: 800; text-transform: uppercase; font-size: 10.5px; letter-spacing: .06em; padding: 9px 6px; text-align: center; }
th:first-child { border-radius: 8px 0 0 0; text-align: left; padding-left: 10px; }
th:last-child { border-radius: 0 8px 0 0; }
td { padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--line); font-weight: 700; white-space: nowrap; }
td:first-child { text-align: left; padding-left: 10px; color: var(--muted); font-weight: 600; }
tr.diff td { color: var(--green); border-bottom: 0; }
tr.diff td:first-child { color: var(--green); }
.hist { display: flex; flex-direction: column; gap: 8px; }
.h-item { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: var(--r-md); background: var(--panel); border: 1px solid var(--line-2); text-align: left; width: 100%; }
.h-item .d { text-align: center; }
.h-item .d b { display: block; font-size: 18px; font-weight: 900; line-height: 1.05; }
.h-item .d span { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.h-item strong { display: block; font-size: 13.5px; font-weight: 800; }
.h-item p { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-weight: 500; }
.badge { font-size: 10.5px; font-weight: 800; padding: 4px 8px; border-radius: 7px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.b-done { background: var(--green-soft); color: var(--green); }
.b-plan { background: var(--orange-soft); color: var(--orange); }
.b-cancel { background: var(--field); color: var(--muted); }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 7px 13px; font-weight: 700; font-size: 12.5px; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- Shop ---------- */
.plans { display: flex; flex-direction: column; gap: 10px; }
.plan { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 16px; border-radius: var(--r-lg); background: var(--panel); border: 1.5px solid var(--line-2); text-align: left; width: 100%; transition: border-color .15s; }
.plan[aria-pressed="true"] { border-color: var(--orange); background: linear-gradient(135deg, rgba(255, 106, 26, .12), rgba(255, 106, 26, .02)), var(--panel); }
.plan b { font-size: 16px; font-weight: 800; }
.plan .price { font-size: 20px; font-weight: 900; text-align: right; white-space: nowrap; }
.plan .per { font-size: 12px; color: var(--muted); font-weight: 600; }
.plan .old { font-size: 12px; color: var(--dim); text-decoration: line-through; text-align: right; font-weight: 600; }
.plan .tag { position: absolute; top: -9px; right: 14px; background: var(--grad); color: #fff; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; padding: 4px 8px; border-radius: 6px; }
.plan .tag.alt { background: var(--green); color: #0D0E10; }
.incl { display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; }
.incl span { display: flex; gap: 9px; align-items: flex-start; }
.incl .ic { width: 17px; height: 17px; color: var(--orange); margin-top: 1px; }
.pay-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.pay-row:last-child { border-bottom: 0; }
.pay-row span { color: var(--muted); font-weight: 600; }
.pay-row b { font-weight: 800; text-align: right; }
.methods { display: flex; flex-direction: column; gap: 8px; }
.method { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: var(--r-md); border: 1.5px solid var(--line-2); background: var(--panel); text-align: left; width: 100%; }
.method .m-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--field); display: grid; place-items: center; flex: none; }
.method b { display: block; font-size: 14px; font-weight: 800; }
.method span.d { font-size: 12px; color: var(--muted); font-weight: 600; }
.method .radio { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-2); flex: none; }
.method[aria-pressed="true"] { border-color: var(--orange); }
.method[aria-pressed="true"] .radio { border: 6px solid var(--orange); }
.secure { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.secure .ic { width: 14px; height: 14px; }
.spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--field); border-top-color: var(--orange); animation: spin .8s linear infinite; margin: 16px auto 4px; }
@keyframes spin { to { transform: rotate(360deg); } }
.success { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 6px; }
.success .ok { width: 72px; height: 72px; border-radius: 22px; background: var(--green); color: #0D0E10; display: grid; place-items: center; }
.success .ok svg { width: 36px; height: 36px; }
.success h3 { font-size: 22px; }
.success p { margin: 0; color: var(--muted); font-size: 13.5px; }

/* ---------- About ---------- */
.about-hero { position: relative; overflow: hidden; border-radius: 22px; border: 1px solid var(--line-2); display: grid; grid-template-columns: 1fr 1fr; min-height: 260px; background: var(--panel); }
.about-hero img { width: 100%; height: 100%; object-fit: cover; object-position: 55% 0; }
.about-hero .txt { padding: 18px 16px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.about-hero h1 { font-size: 22px; }
.about-hero p { margin: 0; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.quote { font-style: italic; color: var(--orange-2); font-weight: 600; font-size: 13.5px; }
.rules { display: grid; grid-template-columns: 1fr; gap: 14px; }
.rule { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.rule .r-ic { width: 36px; height: 36px; border-radius: 10px; background: var(--orange-soft); color: var(--orange); display: grid; place-items: center; flex: none; }
.rule .r-ic .ic { width: 18px; height: 18px; }
.rule b { display: block; color: var(--ink); font-size: 13px; font-weight: 800; margin-bottom: 2px; }
.cert-btn { border: 0; padding: 0; background: none; border-radius: 12px; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 11.5px; font-weight: 700; padding: 5px 9px; border-radius: 7px; background: var(--field); color: var(--ink); }
.contact { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--panel-2); border: 1px solid var(--line-2); text-decoration: none; color: inherit; font-weight: 700; }
.contact .c-ic { width: 34px; height: 34px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; color: #fff; flex: none; }
.contact .c-ic .ic { width: 17px; height: 17px; }
.contact span { font-size: 12px; color: var(--muted); display: block; font-weight: 600; }

/* ---------- Tab bar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.tabbar-in { max-width: 460px; margin: 0 auto; height: var(--tab-h); display: grid; grid-template-columns: repeat(5, 1fr); background: rgba(23, 24, 28, .92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--line-2); border-radius: 20px; padding: 6px; }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--dim); border-radius: 14px; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--orange); background: var(--orange-soft); }

/* ---------- Sheet & toast ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .65); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; animation: up .28s cubic-bezier(.2, .8, .2, 1); }
.sheet > * { flex: none; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } }
.grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); align-self: center; }
.sheet h3 { font-size: 19px; font-weight: 900; text-transform: uppercase; }
.sheet p { margin: 0; }
.box { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px 14px; }
.fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.field input { width: 100%; border: 1.5px solid var(--line-2); background: var(--panel-2); border-radius: 10px; padding: 11px 10px; font-size: 16px; font-weight: 700; outline: none; }
.field input:focus { border-color: var(--orange); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toast-wrap { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + 22px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; max-width: 420px; animation: up .25s; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 360px) { .hero h1 { font-size: 23px; } .slots { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>

  <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></g></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19C5 10.5 11 5 20 4.5 20 13.5 14 19.5 5.5 19.5"/><path d="M5 19.5l7.5-7.5"/></g></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M4 5.5h16v10.5H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-insta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></g></symbol>
  <symbol id="i-tg" viewBox="0 0 24 24"><path d="M20.5 4.5L3.5 11l5.5 2 2 6 3-4 4.5 3.5z M9 13l9-6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>

  </div>

<script>
(function () {
  "use strict";

  /* ================= Настройки тренера ================= */
  const CONFIG = {
    coach: "Дмитрий Зайцев",
    instagram: "dim.zaitsev",
    telegram: "",              // ник в Telegram для кнопки «Написать», напр. "dim_zaitsev"
    currency: "₾",
    cancelHours: 12,           // бесплатная отмена не позже чем за N часов — тренировка возвращается в пакет
    hours: {
      gym:    ["08:00", "09:00", "10:00", "11:00", "17:00", "18:00", "19:00", "20:00"],
      online: ["07:00", "08:00", "12:00", "13:00", "19:00", "20:00", "21:00", "22:00"]
    },
    // В боевой версии: бот создаёт счёт (createInvoiceLink) и отдаёт ссылку сюда, оплата — tg.openInvoice
    invoiceEndpoint: "",
    plans: [
      { id: "one",  title: "Разовая тренировка", n: 1,  days: 14, price: 70 },
      { id: "p4",   title: "4 тренировки",       n: 4,  days: 30, price: 260, old: 280 },
      { id: "p8",   title: "8 тренировок",       n: 8,  days: 45, price: 480, old: 560, tag: "Популярный" },
      { id: "p12",  title: "12 тренировок",      n: 12, days: 60, price: 660, old: 840, tag: "Выгоднее всего", alt: true }
    ]
  };

  /* ================= Telegram ================= */
  const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform
    && window.Telegram.WebApp.platform !== "unknown" ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor("#0D0E10"); tg.setBackgroundColor("#0D0E10"); } catch (e) { }
  }
  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user || null;
  const haptic = t => { try { tg && tg.HapticFeedback && (t === "select" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.notificationOccurred(t)); } catch (e) { } };

  /* ================= Утилиты ================= */
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const svg = id => '<svg class="ic"><use href="#' + id + '"/></svg>';
  const pad = n => String(n).padStart(2, "0");
  const DAY_SHORT = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
  const DAY_FULL = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
  const MONTH_GEN = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  const MONTH_NOM = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
  const MONTH_SHORT = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
  const fmtDate = s => { const d = parse(s); return d.getDate() + " " + MONTH_GEN[d.getMonth()]; };
  const fmtLong = s => { const d = parse(s); return DAY_FULL[d.getDay()] + ", " + d.getDate() + " " + MONTH_GEN[d.getMonth()]; };
  const at = (date, time) => { const d = parse(date); const [h, m] = time.split(":").map(Number); d.setHours(h, m); return d; };
  const money = n => n.toLocaleString("ru-RU") + " " + CONFIG.currency;
  function plural(n, one, few, many) {
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
    return many;
  }
  const trn = n => plural(n, "тренировка", "тренировки", "тренировок");
  function hash(s) { let x = 7; for (let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0; return x; }

  /* ================= Данные ================= */
  const FOCUS = ["Ноги и ягодицы", "Спина и плечи", "Full body", "Грудь, дельты, трицепс", "Кор и выносливость"];
  const NOTES = ["Отличная техника приседа, в следующий раз добавим вес.", "Тяга стала ровнее, лопатки работают.", "Пульс держали в зоне, молодец.", "Жим +2,5 кг к прошлой неделе.", "Планка 75 секунд — прогресс."];

  function seed() {
    const done = [24, 20, 17, 10, 5].map((n, i) => {
      let d = addDays(TODAY, -n); if (d.getDay() === 0) d = addDays(d, -1);
      return { id: "h" + i, date: iso(d), time: ["18:00", "09:00", "19:00", "18:00", "10:00"][i], fmt: i === 2 ? "online" : "gym", status: "done", focus: FOCUS[i % 5], note: NOTES[i % 5] };
    });
    const cancelled = { id: "hc", date: iso(addDays(TODAY, -8)), time: "18:00", fmt: "gym", status: "cancelled", focus: "", note: "" };
    let nd = addDays(TODAY, 2); if (nd.getDay() === 0) nd = addDays(nd, 1);
    const planned = { id: "b1", date: iso(nd), time: "18:00", fmt: "gym", status: "planned", focus: "Ноги и ягодицы", note: "" };
    const measures = [
      { date: iso(addDays(TODAY, -28)), weight: 78.4, waist: 84, hips: 104, chest: 98, biceps: 29 },
      { date: iso(addDays(TODAY, -14)), weight: 76.9, waist: 82, hips: 102, chest: 97, biceps: 29 },
      { date: iso(addDays(TODAY, -1)),  weight: 75.6, waist: 80, hips: 101, chest: 96, biceps: 29.5 }
    ];
    return {
      name: tgUser && tgUser.first_name || "Анна",
      pkg: { title: "8 тренировок", total: 8, until: iso(addDays(TODAY, 19)) },
      bookings: [planned].concat(done, [cancelled]),
      measures,
      payments: [{ id: "pay0", date: iso(addDays(TODAY, -27)), title: "8 тренировок", amount: 480, method: "Карта •• 4417" }]
    };
  }
  const KEY = "zaitsev-cabinet-v1";
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !Array.isArray(S.bookings)) S = seed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } };

  /* Баланс пакета: проведённые списаны, запланированные зарезервированы */
  function balance() {
    if (!S.pkg) return { total: 0, done: 0, planned: 0, left: 0, expired: false };
    const since = S.pkg.since || "0000";
    const mine = S.bookings.filter(b => b.date >= since);
    const done = mine.filter(b => b.status === "done").length;
    const planned = mine.filter(b => b.status === "planned").length;
    const expired = parse(S.pkg.until) < TODAY;
    return { total: S.pkg.total, done, planned, left: expired ? 0 : Math.max(0, S.pkg.total - done - planned), expired };
  }
  const upcoming = () => S.bookings.filter(b => b.status === "planned" && at(b.date, b.time) > new Date()).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  /* Тренировки, время которых прошло, считаются проведёнными (в боевой версии отмечает тренер) */
  (function settle() {
    let changed = false;
    S.bookings.forEach(b => { if (b.status === "planned" && at(b.date, b.time) < new Date(Date.now() - 3600000)) { b.status = "done"; b.focus = b.focus || "Full body"; changed = true; } });
    if (changed) save();
  })();

  /* ================= Навигация ================= */
  const ui = { tab: "home", fmt: "gym", month: new Date(TODAY.getFullYear(), TODAY.getMonth(), 1), day: null, time: null, filter: "all", plan: "p8", method: "tg" };
  function go(tab) {
    ui.tab = tab;
    $$(".tab").forEach(t => t.dataset.tab === tab ? t.setAttribute("aria-current", "page") : t.removeAttribute("aria-current"));
    render();
    window.scrollTo({ top: 0 });
  }
  function render() { ({ home: renderHome, book: renderBook, progress: renderProgress, shop: renderShop, about: renderAbout })[ui.tab](); bind(); }
  function bind() {
    $$("[data-go]").forEach(b => b.onclick = () => { haptic("select"); go(b.dataset.go); });
  }
  $$(".tab").forEach(t => t.onclick = () => { haptic("select"); go(t.dataset.tab); });

  /* ================= Общие блоки ================= */
  function ring(done, planned, total) {
    const r = 40, c = 2 * Math.PI * r;
    const fDone = total ? done / total : 0, fPlan = total ? planned / total : 0;
    return '<div class="ring"><svg viewBox="0 0 96 96">' +
      '<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9348"/><stop offset="1" stop-color="#FF5A14"/></linearGradient></defs>' +
      '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="#26272D" stroke-width="9"/>' +
      '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="rgba(255,106,26,.35)" stroke-width="9" stroke-dasharray="' + (c * (fDone + fPlan)) + ' ' + c + '"/>' +
      '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (c * fDone) + ' ' + c + '"/>' +
      '</svg><div class="c"><div><b class="num">' + Math.max(0, total - done - planned) + '</b><span>осталось</span></div></div></div>';
  }
  function pips(bal) {
    let h = "";
    for (let i = 0; i < bal.total; i++) h += '<i class="' + (i < bal.done ? "done" : i < bal.done + bal.planned ? "res" : "") + '"></i>';
    return '<div class="pips" style="--n:' + Math.min(bal.total, 12) + '">' + h + '</div>';
  }
  function pkgCard() {
    const bal = balance();
    if (!S.pkg || bal.expired || bal.left + bal.planned === 0) {
      return '<div class="panel pad sec">' +
        '<div class="warn">' + svg("i-alert") + '<span>' + (S.pkg && bal.expired ? "Срок абонемента закончился" : "Тренировки в абонементе закончились") + '. Продлите, чтобы записаться.</span></div>' +
        '<button class="btn btn-orange" type="button" data-go="shop">' + svg("i-card") + 'Купить абонемент</button></div>';
    }
    const daysLeft = Math.round((parse(S.pkg.until) - TODAY) / 86400000);
    return '<div class="panel pad sec">' +
      '<div class="pkg">' + ring(bal.done, bal.planned, bal.total) +
        '<div class="pkg-info"><div class="eyebrow">Мой абонемент</div><b>' + esc(S.pkg.title) + '</b>' +
          '<div class="rows">' +
            '<span><i style="background:var(--grad)"></i>Проведено: ' + bal.done + '</span>' +
            '<span><i style="box-shadow:inset 0 0 0 1.5px var(--orange)"></i>Запланировано: ' + bal.planned + '</span>' +
            '<span>' + svg("i-clock").replace('class="ic"', 'class="ic" style="width:13px;height:13px"') + 'до ' + fmtDate(S.pkg.until) + ' · ' + daysLeft + ' ' + plural(daysLeft, "день", "дня", "дней") + '</span>' +
          '</div>' +
        '</div></div>' + pips(bal) +
      (bal.left <= 2 ? '<div class="warn">' + svg("i-alert") + '<span>Осталось ' + bal.left + ' ' + trn(bal.left) + '. Продлите заранее — со скидкой до 21%.</span></div>' : "") +
    '</div>';
  }
  function bookingRow(b) {
    const d = parse(b.date);
    return '<div class="panel pad next">' +
      '<div class="date-tile"><b class="num">' + d.getDate() + '</b><span>' + MONTH_SHORT[d.getMonth()] + '</span></div>' +
      '<div class="next-info"><b>' + esc(b.focus || "Персональная тренировка") + '</b>' +
        '<span>' + svg("i-clock") + DAY_SHORT[d.getDay()] + ', ' + b.time + '</span>' +
        '<span>' + svg(b.fmt === "online" ? "i-video" : "i-pin") + (b.fmt === "online" ? "Онлайн, видеосвязь" : "Зал, Батуми") + '</span></div>' +
      '<button class="chev" type="button" data-manage="' + b.id + '" aria-label="Управлять записью">' + svg("i-right") + '</button></div>';
  }
  function bindManage() { $$("[data-manage]").forEach(b => b.onclick = () => manage(b.dataset.manage)); }

  /* ================= 1. Главная ================= */
  function renderHome() {
    const up = upcoming();
    const monthDone = S.bookings.filter(b => b.status === "done" && parse(b.date).getMonth() === TODAY.getMonth() && parse(b.date).getFullYear() === TODAY.getFullYear()).length;
    const allDone = S.bookings.filter(b => b.status === "done").length;
    const m = S.measures, dw = m.length > 1 ? Math.round((m[m.length - 1].weight - m[0].weight) * 10) / 10 : 0;
    const h = new Date().getHours();
    const hi = h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер";

    $("#root").innerHTML =
      '<section class="view">' +
        '<header class="top"><div class="ava"><img src="img/avatar.jpg" alt=""></div>' +
          '<div><div class="hi">' + hi + ',</div><b>' + esc(S.name) + '</b></div>' +
          '<button class="demo" type="button" id="reset" title="Сбросить демо-данные">Демо</button></header>' +

        '<div class="hero"><img src="img/hero.jpg" alt="">' +
          '<span class="eyebrow" style="color:rgba(255,255,255,.7)">Персонально · ' + esc(CONFIG.coach) + '</span>' +
          '<h1 class="title">Индивидуальные тренировки</h1>' +
          '<p>В зале в Батуми или онлайн из любой страны. Выберите время — запись за 30 секунд.</p>' +
          '<button class="btn btn-orange" type="button" data-go="book">' + svg("i-cal") + 'Записаться на тренировку</button>' +
        '</div>' +

        pkgCard() +

        '<div class="sec"><div class="sec-head"><h2 class="h-sec left">Ближайшая тренировка</h2>' + (up.length > 1 ? '<button class="link" type="button" data-go="progress">Все ' + up.length + '</button>' : "") + '</div>' +
          (up.length ? bookingRow(up[0]) : '<div class="panel empty">Пока нет записей.<br><button class="link" type="button" data-go="book" style="margin-top:8px">Выбрать время →</button></div>') +
        '</div>' +

        '<div class="stats">' +
          '<div class="stat"><b class="num">' + monthDone + '</b><span>' + plural(monthDone, "тренировка", "тренировки", "тренировок") + ' в этом месяце</span></div>' +
          '<div class="stat"><b class="num">' + allDone + '</b><span>всего со мной</span></div>' +
          '<div class="stat' + (dw < 0 ? " good" : "") + '"><b class="num">' + (dw > 0 ? "+" : "") + String(dw).replace(".", ",") + '<small> кг</small></b><span>с первого замера</span></div>' +
        '</div>' +
      '</section>';

    bindManage();
    $("#reset").onclick = () => { if (confirm("Сбросить демо-данные?")) { S = seed(); save(); render(); toast("Демо-данные сброшены"); } };
  }

  /* ================= 2. Запись (календарь) ================= */
  function slotState(date, time) {
    const mine = S.bookings.find(b => b.status === "planned" && b.date === date && b.time === time);
    if (mine) return "mine";
    if (at(date, time) < new Date(Date.now() + 2 * 3600000)) return "busy";
    return hash(ui.fmt + date + time) % 3 === 0 ? "busy" : "free";
  }
  const dayOff = d => d.getDay() === 0;
  const maxDate = () => addDays(TODAY, 42);
  function dayHasFree(d) { return !dayOff(d) && d >= TODAY && d <= maxDate() && CONFIG.hours[ui.fmt].some(t => slotState(iso(d), t) === "free"); }

  function renderBook() {
    const bal = balance();
    const m = ui.month, y = m.getFullYear(), mo = m.getMonth();
    if (!ui.day) { let d = TODAY; while (!dayHasFree(d) && d < maxDate()) d = addDays(d, 1); ui.day = iso(d); ui.month = new Date(d.getFullYear(), d.getMonth(), 1); }
    const first = new Date(y, mo, 1), lead = (first.getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate();
    let cells = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"].map(w => '<div class="wd">' + w + '</div>').join("");
    for (let i = 0; i < lead; i++) cells += "<div></div>";
    for (let n = 1; n <= days; n++) {
      const d = new Date(y, mo, n), s = iso(d);
      const mineDone = S.bookings.some(b => b.date === s && b.status === "done");
      const minePlan = S.bookings.some(b => b.date === s && b.status === "planned");
      const can = d >= TODAY && d <= maxDate() && !dayOff(d);
      const cls = [s === iso(TODAY) ? "today" : "", minePlan ? "has" : mineDone ? "has done" : ""].join(" ").trim();
      cells += '<button type="button" class="' + cls + '" data-day="' + s + '"' + (can ? "" : " disabled") + ' aria-pressed="' + (s === ui.day) + '" aria-label="' + fmtLong(s) + '">' + n + '</button>';
    }
    const prevOk = new Date(y, mo, 0) >= new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    const nextOk = new Date(y, mo + 1, 1) <= maxDate();

    const times = CONFIG.hours[ui.fmt];
    const slotsHtml = dayOff(parse(ui.day)) ? '<div class="empty">Воскресенье — выходной</div>' :
      '<div class="slots">' + times.map(t => {
        const st = slotState(ui.day, t);
        return '<button type="button" class="slot num' + (st === "mine" ? " mine" : "") + '" data-time="' + t + '"' + (st === "busy" ? " disabled" : "") + ' aria-pressed="' + (ui.time === t && st === "free") + '">' + t + '</button>';
      }).join("") + '</div>';

    $("#root").innerHTML =
      '<section class="view">' +
        '<div><div class="eyebrow">Запись</div><h1 class="title h-page" style="margin-top:4px">Выберите <span>день и время</span></h1></div>' +
        '<div class="seg" role="group" aria-label="Формат">' +
          '<button type="button" data-fmt="gym" aria-pressed="' + (ui.fmt === "gym") + '">' + svg("i-pin") + 'Зал, Батуми</button>' +
          '<button type="button" data-fmt="online" aria-pressed="' + (ui.fmt === "online") + '">' + svg("i-video") + 'Онлайн</button>' +
        '</div>' +
        '<div class="panel pad">' +
          '<div class="cal-head"><b>' + MONTH_NOM[mo] + ' ' + y + '</b><div class="cal-nav">' +
            '<button type="button" id="m-prev" aria-label="Предыдущий месяц"' + (prevOk ? "" : " disabled") + '>' + svg("i-left") + '</button>' +
            '<button type="button" id="m-next" aria-label="Следующий месяц"' + (nextOk ? "" : " disabled") + '>' + svg("i-right") + '</button></div></div>' +
          '<div class="cal">' + cells + '</div>' +
          '<div class="legend" style="margin-top:12px"><span><i style="background:var(--orange);border-radius:50%"></i>моя запись</span><span><i style="background:var(--green);border-radius:50%"></i>была тренировка</span></div>' +
        '</div>' +
        '<div class="sec"><div class="sec-head"><h2 class="h-sec left">' + fmtLong(ui.day) + '</h2><span class="muted" style="font-size:11.5px;font-weight:600">время Батуми</span></div>' + slotsHtml +
          '<div class="legend"><span><i style="background:var(--panel-2);border:1px solid var(--line-2)"></i>свободно</span><span><i style="border:1px dashed var(--dim)"></i>занято</span><span><i style="background:var(--green-soft);border:1px solid var(--green)"></i>ваша запись</span></div>' +
        '</div>' +
        '<div class="panel pad" style="display:flex;justify-content:space-between;align-items:center;gap:12px">' +
          '<span style="font-size:13px;font-weight:600" class="muted">В абонементе</span><b>' + (S.pkg && !bal.expired ? bal.left + ' ' + trn(bal.left) : "нет тренировок") + '</b></div>' +
        '<button class="btn btn-orange" type="button" id="book-btn"' + (ui.time ? "" : " disabled") + '>' + (ui.time ? "Записаться · " + fmtDate(ui.day) + ", " + ui.time : "Выберите время") + '</button>' +
      '</section>';

    $$("[data-fmt]").forEach(b => b.onclick = () => { haptic("select"); ui.fmt = b.dataset.fmt; ui.time = null; render(); });
    $$("[data-day]").forEach(b => b.onclick = () => { haptic("select"); ui.day = b.dataset.day; ui.time = null; render(); });
    $$("[data-time]").forEach(b => b.onclick = () => {
      const st = slotState(ui.day, b.dataset.time);
      if (st === "mine") { manage(S.bookings.find(x => x.status === "planned" && x.date === ui.day && x.time === b.dataset.time).id); return; }
      haptic("select"); ui.time = b.dataset.time; render();
    });
    $("#m-prev").onclick = () => { ui.month = new Date(y, mo - 1, 1); render(); };
    $("#m-next").onclick = () => { ui.month = new Date(y, mo + 1, 1); render(); };
    $("#book-btn").onclick = confirmBooking;
  }

  function confirmBooking() {
    const bal = balance();
    if (!S.pkg || bal.left < 1) {
      openSheet('<h3>Нет доступных тренировок</h3><p class="muted">' + (S.pkg && bal.expired ? "Срок абонемента закончился." : "Все тренировки абонемента уже использованы или запланированы.") + ' Оплатите новый абонемент прямо здесь — запись сохранится.</p>' +
        '<button class="btn btn-orange" type="button" id="to-shop">' + svg("i-card") + 'Выбрать абонемент</button>');
      $("#to-shop").onclick = () => { closeSheet(); ui.afterPay = { date: ui.day, time: ui.time, fmt: ui.fmt }; go("shop"); };
      return;
    }
    if (parse(ui.day) > parse(S.pkg.until)) { toast("Абонемент действует до " + fmtDate(S.pkg.until) + ". Выберите более раннюю дату или продлите"); return; }
    openSheet('<h3>Подтвердите запись</h3>' +
      '<div class="box">' +
        '<div class="pay-row"><span>Когда</span><b>' + fmtLong(ui.day) + ', ' + ui.time + '</b></div>' +
        '<div class="pay-row"><span>Формат</span><b>' + (ui.fmt === "online" ? "Онлайн, видеосвязь" : "Зал, Батуми") + '</b></div>' +
        '<div class="pay-row"><span>Спишется</span><b>1 из абонемента · останется ' + (bal.left - 1) + '</b></div>' +
      '</div>' +
      '<p class="muted" style="font-size:12.5px">Отмена не позже чем за ' + CONFIG.cancelHours + ' часов — тренировка вернётся в абонемент. Напоминание придёт в Telegram за 2 часа.</p>' +
      '<button class="btn btn-orange" type="button" id="do-book">' + svg("i-check") + 'Подтвердить</button>');
    $("#do-book").onclick = () => doBook(ui.day, ui.time, ui.fmt);
  }
  function doBook(date, time, fmt) {
    S.bookings.unshift({ id: "b" + Date.now(), date, time, fmt, status: "planned", focus: "", note: "" });
    save(); haptic("success"); closeSheet();
    ui.time = null;
    toast("Готово! Вы записаны на " + fmtDate(date) + ", " + time);
    go("home");
  }
  function manage(id) {
    const b = S.bookings.find(x => x.id === id); if (!b) return;
    const hoursLeft = (at(b.date, b.time) - new Date()) / 3600000;
    const free = hoursLeft >= CONFIG.cancelHours;
    openSheet('<h3>Ваша запись</h3>' +
      '<div class="box">' +
        '<div class="pay-row"><span>Когда</span><b>' + fmtLong(b.date) + ', ' + b.time + '</b></div>' +
        '<div class="pay-row"><span>Формат</span><b>' + (b.fmt === "online" ? "Онлайн, видеосвязь" : "Зал, Батуми") + '</b></div>' +
      '</div>' +
      '<p class="muted" style="font-size:12.5px">' + (free ? "До тренировки больше " + CONFIG.cancelHours + " часов — при отмене она вернётся в абонемент." : "До тренировки меньше " + CONFIG.cancelHours + " часов — при отмене она сгорит.") + '</p>' +
      '<div class="row2"><button class="btn btn-dark" type="button" id="resched">Перенести</button><button class="btn btn-danger" type="button" id="cancel">Отменить</button></div>');
    $("#cancel").onclick = () => {
      if (free) S.bookings = S.bookings.filter(x => x.id !== id);   // слот освобождается, тренировка возвращается
      else { b.status = "done"; b.focus = "Поздняя отмена"; b.note = "Сгорела: отмена менее чем за " + CONFIG.cancelHours + " ч"; }
      save(); haptic("warning"); closeSheet(); render();
      toast(free ? "Запись отменена, тренировка вернулась в абонемент" : "Запись отменена");
    };
    $("#resched").onclick = () => {
      if (!free) { toast("Перенос возможен не позже чем за " + CONFIG.cancelHours + " часов"); return; }
      S.bookings = S.bookings.filter(x => x.id !== id); save(); closeSheet();
      ui.fmt = b.fmt; ui.day = b.date; ui.time = null; ui.month = new Date(parse(b.date).getFullYear(), parse(b.date).getMonth(), 1);
      toast("Выберите новое время — тренировка уже в абонементе");
      go("book");
    };
  }

  /* ================= 3. Прогресс ================= */
  function weightChart() {
    const m = S.measures;
    if (m.length < 2) return '<div class="empty">Добавьте ещё один замер — появится график</div>';
    const W = 320, H = 150, px = 14, pt = 18, pb = 24;
    const ws = m.map(x => x.weight), min = Math.min(...ws) - .8, max = Math.max(...ws) + .8;
    const X = i => px + i * (W - 2 * px) / (m.length - 1), Y = v => pt + (max - v) / (max - min) * (H - pt - pb);
    const pts = m.map((x, i) => X(i) + "," + Y(x.weight)).join(" ");
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="График веса">' +
      '<defs><linearGradient id="wa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,106,26,.35)"/><stop offset="1" stop-color="rgba(255,106,26,0)"/></linearGradient></defs>' +
      '<polygon points="' + X(0) + ',' + (H - pb) + ' ' + pts + ' ' + X(m.length - 1) + ',' + (H - pb) + '" fill="url(#wa)"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="#FF6A1A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      m.map((x, i) => '<circle cx="' + X(i) + '" cy="' + Y(x.weight) + '" r="4" fill="#0D0E10" stroke="#FF6A1A" stroke-width="2.5" vector-effect="non-scaling-stroke"/>' +
        '<text x="' + X(i) + '" y="' + (Y(x.weight) - 9) + '" fill="#F3F3F4" font-size="10.5" font-weight="700" text-anchor="' + (i === 0 ? "start" : i === m.length - 1 ? "end" : "middle") + '" font-family="Montserrat, sans-serif">' + String(x.weight).replace(".", ",") + '</text>' +
        '<text x="' + X(i) + '" y="' + (H - 6) + '" fill="#9A9BA3" font-size="10" font-weight="600" text-anchor="' + (i === 0 ? "start" : i === m.length - 1 ? "end" : "middle") + '" font-family="Montserrat, sans-serif">' + parse(x.date).getDate() + ' ' + MONTH_SHORT[parse(x.date).getMonth()] + '</text>').join("") +
      '</svg>';
  }
  function renderProgress() {
    const bal = balance(), m = S.measures;
    const f = m[0], l = m[m.length - 1];
    const d = k => { const v = Math.round((l[k] - f[k]) * 10) / 10; return (v > 0 ? "+" : "") + String(v).replace(".", ","); };
    const cols = [["weight", "Вес"], ["waist", "Талия"], ["hips", "Бёдра"], ["chest", "Грудь"], ["biceps", "Бицепс"]];
    const list = S.bookings.slice().sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time))
      .filter(b => ui.filter === "all" || b.status === ui.filter);
    const BADGE = { done: ['b-done', 'Проведена'], planned: ['b-plan', 'Запланирована'], cancelled: ['b-cancel', 'Отменена'] };

    $("#root").innerHTML =
      '<section class="view">' +
        '<div><div class="eyebrow">Прогресс</div><h1 class="title h-page" style="margin-top:4px">Мои <span>результаты</span></h1></div>' +

        '<div class="panel pad sec"><h2 class="h-sec">Абонемент</h2>' +
          (S.pkg ? '<div style="display:flex;justify-content:space-between;font-weight:700;font-size:13px"><span>' + esc(S.pkg.title) + '</span><span class="muted">до ' + fmtDate(S.pkg.until) + '</span></div>' + pips(bal) +
            '<div class="stats"><div class="stat"><b class="num">' + bal.done + '</b><span>использовано</span></div><div class="stat"><b class="num">' + bal.planned + '</b><span>запланировано</span></div><div class="stat"><b class="num accent">' + bal.left + '</b><span>можно записать</span></div></div>'
            : '<div class="empty">Абонемента пока нет</div>') +
          '<button class="btn btn-dark" type="button" data-go="shop">' + svg("i-plus") + 'Продлить абонемент</button>' +
        '</div>' +

        '<div class="panel pad">' +
          '<div class="chart-top"><div><div class="eyebrow">Вес, кг</div><b class="num">' + String(l.weight).replace(".", ",") + '</b></div>' + (m.length > 1 ? '<span class="delta">' + d("weight") + ' кг за ' + Math.round((parse(l.date) - parse(f.date)) / 86400000) + ' дн</span>' : "") + '</div>' +
          weightChart() +
        '</div>' +

        '<div class="panel pad sec"><h2 class="h-sec">Фиксация результата</h2>' +
          '<div class="tbl-wrap"><table><thead><tr><th>Дата</th>' + cols.map(c => '<th>' + c[1] + '</th>').join("") + '</tr></thead><tbody>' +
            m.slice().reverse().map(x => '<tr><td>' + parse(x.date).getDate() + ' ' + MONTH_SHORT[parse(x.date).getMonth()] + '</td>' + cols.map(c => '<td class="num">' + String(x[c[0]]).replace(".", ",") + '</td>').join("") + '</tr>').join("") +
            (m.length > 1 ? '<tr class="diff"><td>Итог</td>' + cols.map(c => '<td class="num">' + d(c[0]) + '</td>').join("") + '</tr>' : "") +
          '</tbody></table></div>' +
          '<p class="muted" style="margin:0;font-size:12px">Замеры раз в 2 недели утром натощак — так видно реальную динамику, даже когда вес стоит.</p>' +
          '<button class="btn btn-orange" type="button" id="add-m">' + svg("i-plus") + 'Добавить замеры</button>' +
        '</div>' +

        '<div class="sec"><h2 class="h-sec left">История тренировок</h2>' +
          '<div class="filters" role="group" aria-label="Фильтр">' + [["all", "Все"], ["planned", "Запланированные"], ["done", "Проведённые"], ["cancelled", "Отменённые"]].map(([k, t]) => '<button type="button" data-filter="' + k + '" aria-pressed="' + (ui.filter === k) + '">' + t + '</button>').join("") + '</div>' +
          '<div class="hist">' + (list.length ? list.map(b => {
            const dt = parse(b.date), bd = BADGE[b.status];
            const tag = b.status === "planned" ? 'button type="button" data-manage="' + b.id + '"' : 'div';
            return '<' + tag + ' class="h-item"><div class="d"><b class="num">' + dt.getDate() + '</b><span>' + MONTH_SHORT[dt.getMonth()] + '</span></div>' +
              '<div><strong>' + esc(b.focus || (b.status === "cancelled" ? "Тренировка отменена" : "Персональная тренировка")) + '</strong><p>' + DAY_SHORT[dt.getDay()] + ', ' + b.time + ' · ' + (b.fmt === "online" ? "онлайн" : "зал") + (b.note ? ' — ' + esc(b.note) : "") + '</p></div>' +
              '<span class="badge ' + bd[0] + '">' + bd[1] + '</span></' + (b.status === "planned" ? "button" : "div") + '>';
          }).join("") : '<div class="empty">Ничего не найдено</div>') + '</div>' +
        '</div>' +
      '</section>';

    bindManage();
    $$("[data-filter]").forEach(b => b.onclick = () => { haptic("select"); ui.filter = b.dataset.filter; render(); });
    $("#add-m").onclick = addMeasure;
  }
  function addMeasure() {
    const l = S.measures[S.measures.length - 1] || {};
    const flds = [["weight", "Вес, кг"], ["waist", "Талия"], ["hips", "Бёдра"], ["chest", "Грудь"], ["biceps", "Бицепс"]];
    openSheet('<h3>Новые замеры</h3><p class="muted" style="font-size:12.5px">Сантиметры, вес в килограммах. Прошлые значения подставлены — поменяйте то, что изменилось.</p>' +
      '<div class="fields">' + flds.map(([k, t]) => '<div class="field"><label for="m-' + k + '">' + t + '</label><input id="m-' + k + '" inputmode="decimal" value="' + (l[k] != null ? String(l[k]).replace(".", ",") : "") + '"></div>').join("") + '</div>' +
      '<button class="btn btn-orange" type="button" id="save-m">Сохранить</button>');
    $("#save-m").onclick = () => {
      const rec = { date: iso(TODAY) };
      for (const [k] of flds) {
        const v = parseFloat($("#m-" + k).value.replace(",", "."));
        if (!(v > 10 && v < 300)) { $("#m-" + k).focus(); toast("Проверьте значение: " + flds.find(f => f[0] === k)[1]); return; }
        rec[k] = v;
      }
      S.measures = S.measures.filter(x => x.date !== rec.date).concat(rec);
      save(); haptic("success"); closeSheet(); render(); toast("Замеры сохранены");
    };
  }

  /* ================= 4. Абонемент и оплата ================= */
  function renderShop() {
    const bal = balance();
    const p = CONFIG.plans.find(x => x.id === ui.plan);
    $("#root").innerHTML =
      '<section class="view">' +
        '<div><div class="eyebrow">Абонемент</div><h1 class="title h-page" style="margin-top:4px">Оплата <span>без переписки</span></h1></div>' +
        (S.pkg && !bal.expired ? '<div class="panel pad" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span class="muted" style="font-size:13px;font-weight:600">Сейчас: ' + esc(S.pkg.title) + '</span><b>осталось ' + bal.left + '</b></div>' : "") +
        (ui.afterPay ? '<div class="warn">' + svg("i-cal") + '<span>После оплаты запишем вас на ' + fmtDate(ui.afterPay.date) + ', ' + ui.afterPay.time + '.</span></div>' : "") +
        '<div class="plans" role="group" aria-label="Абонементы">' + CONFIG.plans.map(x =>
          '<button type="button" class="plan" data-plan="' + x.id + '" aria-pressed="' + (x.id === ui.plan) + '">' +
            (x.tag ? '<span class="tag' + (x.alt ? " alt" : "") + '">' + x.tag + '</span>' : "") +
            '<b>' + x.title + '</b><span class="price num">' + money(x.price) + '</span>' +
            '<span class="per">' + (x.n > 1 ? money(Math.round(x.price / x.n)) + ' за тренировку · ' : "") + x.days + ' дней</span>' +
            (x.old ? '<span class="old num">' + money(x.old) + '</span>' : '<span></span>') +
          '</button>').join("") + '</div>' +
        '<div class="panel pad sec"><h2 class="h-sec">В каждый абонемент входит</h2><div class="incl">' +
          ['Программа под вашу цель и уровень', 'Рацион питания по правилу тарелки', 'Замеры и контроль прогресса', 'Связь с тренером в Telegram между тренировками', 'Бесплатная отмена за ' + CONFIG.cancelHours + ' часов'].map(t => '<span>' + svg("i-check") + t + '</span>').join("") +
        '</div></div>' +
        (S.payments.length ? '<div class="sec"><h2 class="h-sec left">Мои оплаты</h2><div class="panel" style="padding:4px 16px">' +
          S.payments.map(x => '<div class="pay-row"><span>' + fmtDate(x.date) + ' · ' + esc(x.method) + '</span><b>' + esc(x.title) + ' — ' + money(x.amount) + '</b></div>').join("") + '</div></div>' : "") +
        '<button class="btn btn-orange" type="button" id="buy">' + svg("i-lock") + 'Оплатить ' + money(p.price) + '</button>' +
      '</section>';
    $$("[data-plan]").forEach(b => b.onclick = () => { haptic("select"); ui.plan = b.dataset.plan; render(); });
    $("#buy").onclick = checkout;
  }

  function checkout() {
    const p = CONFIG.plans.find(x => x.id === ui.plan);
    const bal = balance();
    const keep = S.pkg && !bal.expired ? bal.left : 0;
    const methods = [
      ["tg", "i-tg", "Оплата в Telegram", "Карта, Apple Pay, Google Pay"],
      ["card", "i-card", "Банковская карта", "Visa, Mastercard — любая страна"]
    ];
    openSheet('<h3>Оформление</h3>' +
      '<div class="box">' +
        '<div class="pay-row"><span>Абонемент</span><b>' + p.title + '</b></div>' +
        '<div class="pay-row"><span>Действует</span><b>' + p.days + ' дней, до ' + fmtDate(iso(addDays(TODAY, p.days))) + '</b></div>' +
        (keep ? '<div class="pay-row"><span>Остаток переносится</span><b>+' + keep + ' ' + trn(keep) + '</b></div>' : "") +
        '<div class="pay-row"><span>К оплате</span><b class="num" style="font-size:17px;color:var(--orange)">' + money(p.price) + '</b></div>' +
      '</div>' +
      '<div class="methods" role="group" aria-label="Способ оплаты">' + methods.map(m =>
        '<button type="button" class="method" data-method="' + m[0] + '" aria-pressed="' + (ui.method === m[0]) + '"><span class="m-ic">' + svg(m[1]) + '</span><span><b>' + m[2] + '</b><span class="d">' + m[3] + '</span></span><span class="radio"></span></button>').join("") + '</div>' +
      '<button class="btn btn-orange" type="button" id="pay">' + svg("i-lock") + 'Оплатить ' + money(p.price) + '</button>' +
      '<div class="secure">' + svg("i-lock") + 'Платёж защищён. Данные карты не хранятся в приложении.</div>');
    $$("[data-method]").forEach(b => b.onclick = () => { haptic("select"); ui.method = b.dataset.method; $$("[data-method]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
    $("#pay").onclick = () => pay(p);
  }

  function pay(p) {
    // Боевой режим: сервер создаёт ссылку на счёт, Telegram показывает свою платёжную форму
    if (tg && CONFIG.invoiceEndpoint && tg.openInvoice) {
      fetch(CONFIG.invoiceEndpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ plan: p.id, initData: tg.initData }) })
        .then(r => r.json()).then(({ link }) => tg.openInvoice(link, status => { if (status === "paid") credit(p); else if (status !== "cancelled") toast("Оплата не прошла, попробуйте ещё раз"); }))
        .catch(() => toast("Не удалось открыть оплату"));
      return;
    }
    // Демо: имитируем обработку платежа
    $(".sheet").innerHTML = '<div class="grip"></div><div class="spinner"></div><p class="muted" style="text-align:center;font-weight:600">Обрабатываем платёж…</p>';
    setTimeout(() => credit(p), 1400);
  }

  function credit(p) {
    const bal = balance();
    const keep = S.pkg && !bal.expired ? bal.left : 0;
    // остаток и уже запланированные тренировки переходят в новый абонемент
    const carry = keep + S.bookings.filter(b => b.status === "planned").length;
    S.pkg = { title: p.title + (carry ? " + " + carry + " из прошлого" : ""), total: p.n + carry, until: iso(addDays(TODAY, p.days)), since: iso(TODAY) };
    S.payments.unshift({ id: "pay" + Date.now(), date: iso(TODAY), title: p.title, amount: p.price, method: ui.method === "tg" ? "Telegram Pay" : "Карта •• 4417" });
    save(); haptic("success");
    const pending = ui.afterPay; ui.afterPay = null;
    $(".sheet").innerHTML = '<div class="grip"></div><div class="success"><div class="ok">' + svg("i-check") + '</div><h3 class="title">Оплачено</h3>' +
      '<p>' + p.title + ' — ' + money(p.price) + '. Чек отправлен в Telegram.<br>Доступно: ' + balance().left + ' ' + trn(balance().left) + ' до ' + fmtDate(S.pkg.until) + '.</p></div>' +
      (pending ? '<button class="btn btn-orange" type="button" id="finish">' + svg("i-check") + 'Записаться на ' + fmtDate(pending.date) + ', ' + pending.time + '</button>'
               : '<button class="btn btn-orange" type="button" id="finish">' + svg("i-cal") + 'Записаться на тренировку</button>');
    $("#finish").onclick = () => {
      if (pending && slotState(pending.date, pending.time) === "free") { ui.fmt = pending.fmt; doBook(pending.date, pending.time, pending.fmt); }
      else { closeSheet(); go("book"); }
    };
  }

  /* ================= 5. Обо мне ================= */
  function renderAbout() {
    $("#root").innerHTML =
      '<section class="view">' +
        '<div class="about-hero"><img src="img/hero.jpg" alt="Дмитрий Зайцев">' +
          '<div class="txt"><div class="eyebrow">Тренер</div><h1 class="title">Дмитрий <span class="accent">Зайцев</span></h1>' +
          '<p>Тренер онлайн · Энергия и стройность. Персонально в Батуми, онлайн — по всему миру.</p>' +
          '<div class="quote">«Ты можешь всё и даже больше»</div></div></div>' +
        '<div class="stats">' +
          '<div class="stat"><b>2018</b><span>сертификат FPA</span></div>' +
          '<div class="stat"><b>156 ч</b><span>профильного обучения</span></div>' +
          '<div class="stat"><b>🌍</b><span>клиенты из разных стран</span></div>' +
        '</div>' +
        '<div class="panel pad sec"><h2 class="h-sec">Как я работаю</h2><div class="rules">' +
          [["i-dumbbell", "Техника прежде веса", "Рабочий вес подбираем так, чтобы последние 2 повторения давались тяжело, но чисто."],
           ["i-leaf", "Питание без диет", "Правило тарелки и любимая еда — результат держится."],
           ["i-chart", "Замеры, а не ощущения", "Раз в 2 недели фиксируем вес и объёмы — прогресс видно в приложении."],
           ["i-heart", "Самочувствие важнее", "Сон, вода, восстановление. Мамам — мягкий старт после родов."]]
            .map(r => '<div class="rule"><span class="r-ic">' + svg(r[0]) + '</span><div><b>' + r[1] + '</b>' + r[2] + '</div></div>').join("") +
        '</div></div>' +
        '<div class="panel pad sec"><h2 class="h-sec">Образование</h2>' +
          '<button class="cert-btn" type="button" id="cert"><img src="img/cert.jpg" alt="Сертификат FPA «Персональный фитнес-тренер», 2018" loading="lazy"></button>' +
          '<div class="chips">' + ["Анатомия", "Биомеханика", "Физиология", "Питание", "Здоровье и безопасность", "Методика фитнес-тренировки"].map(t => '<span>' + t + '</span>').join("") + '</div>' +
        '</div>' +
        '<div class="panel pad sec"><h2 class="h-sec">Правила записи</h2><div class="incl">' +
          ['Запись и оплата — прямо в приложении, в любое время', 'Отмена не позже чем за ' + CONFIG.cancelHours + ' часов — тренировка возвращается', 'Поздняя отмена или неявка — тренировка сгорает', 'Абонемент нужно использовать до конца срока'].map(t => '<span>' + svg("i-check") + t + '</span>').join("") +
        '</div></div>' +
        '<div class="sec">' +
          '<a class="contact" href="https://instagram.com/' + CONFIG.instagram + '" target="_blank" rel="noopener"><span class="c-ic">' + svg("i-insta") + '</span><div>@' + CONFIG.instagram + '<span>Отзывы и результаты — в актуальном</span></div></a>' +
          (CONFIG.telegram ? '<a class="contact" href="https://t.me/' + CONFIG.telegram + '" target="_blank" rel="noopener"><span class="c-ic">' + svg("i-tg") + '</span><div>Написать в Telegram<span>Вопросы по программе и питанию</span></div></a>' : "") +
        '</div>' +
        '<button class="btn btn-orange" type="button" data-go="book">' + svg("i-cal") + 'Записаться на тренировку</button>' +
      '</section>';
    $("#cert").onclick = () => openSheet('<h3>Сертификат FPA</h3><img src="img/cert.jpg" alt="Сертификат FPA «Персональный фитнес-тренер», 2018" style="border-radius:12px"><p class="muted" style="font-size:13px">Ассоциация профессионалов фитнеса, «Персональный фитнес-тренер», 2018 г.</p>');
  }

  /* ================= Шторка и тост ================= */
  function openSheet(html) {
    $("#sheet-root").innerHTML = '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>' + html + '</div></div>';
    $("#scrim").onclick = e => { if (e.target.id === "scrim") closeSheet(); };
  }
  function closeSheet() { $("#sheet-root").innerHTML = ""; }
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  let tt;
  function toast(msg) {
    $("#toast-root").innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
    clearTimeout(tt); tt = setTimeout(() => { $("#toast-root").innerHTML = ""; }, 2800);
  }

  render();
})();
</script>
</body>
</html>
